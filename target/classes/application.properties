# The database is optional. When spring.datasource.url is not set, the games and
# leaderboard repositories fall back to an in-memory store (see
# com.example.leaderboard.config.RepositoryConfig).
#
# To persist to a file-based H2 database instead, uncomment the following:
# spring.datasource.url=jdbc:h2:file:./data/leaderboard
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.hibernate.ddl-auto=update
